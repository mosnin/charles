[project]
name = "charles-agent"
version = "0.1.0"
description = "Charles background AI agent — Modal + OpenAI Agents SDK"
requires-python = ">=3.12"

dependencies = [
  "openai-agents>=0.0.15",
  "openai>=1.75.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.11.0",
  "httpx>=0.28.0",
  "upstash-redis>=1.3.0",
  "python-dotenv>=1.1.0",
  "modal>=0.73.0",
  "structlog>=25.1.0",
  # Attachment extraction (read_attachment tool)
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  # Composio integrations — load realtor's connected toolkits (Gmail,
  # Slack, HubSpot, etc.) and present them as agent tools so chat AND
  # autonomous runs can act on the realtor's behalf through their
  # connected accounts. Mirrors the TypeScript-side wiring in
  # lib/integrations/composio.ts.
  #
  # Package name: the v3 Python SDK (which matches @composio/core 0.8.x
  # on the TS side, NOT the older `composio-core` package which is
  # frozen at 0.7.21) is published as plain `composio` at 0.13.x.
  "composio>=0.13.0",
  "composio-openai-agents>=0.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
